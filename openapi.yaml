openapi: 3.0.3

info:
  title: CloudBox API
  version: 1.0.0
  description: API for working with files in CloudBox.

paths:
  /v1/files/{fileId}:
    get:
      summary: Get file information.
      parameters:
        - name: fileId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: File information retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    example: 42
                  name:
                    type: string
                    example: report.pdf
                  size:
                    type: integer
                    example: 2048
        '401':
          description: User not authenticated
        '404':
          description: File not found
      security:
      - BearerAuth: []

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
